input {
  # ① Spring Boot 일반/에러 시스템 로그 (2단계 완성본)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["syslog"]
  }

  # ② 3대 카프카 클러스터 실시간 결제 이벤트 구독 (3단계 신규 추가)
  kafka {
    bootstrap_servers => "kafka1:9092,kafka2:9092,kafka3:9092"
    topics => ["payment-events"]
    codec => "json"
    tags => ["payment_event"]
  }
}

output {
  # 시스템 로그 ➔ logs 인덱스 패턴 저장
  if "syslog" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "shoppingmall-logs-%{+YYYY.MM.dd}"
    }
  }
  
  # 결제 이벤트 ➔ payments 인덱스 패턴 저장
  if "payment_event" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "shoppingmall-payments-%{+YYYY.MM.dd}"
    }
  }

  # 터미널 콘솔 디버깅용 포맷 출력
  stdout {
    codec => rubydebug
  }
}
